<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Para Giu ♥</title>
<meta property="og:title" content="Para Giu ♥">
<meta property="og:description" content="Presiona start ▶">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0d0d1a;overflow:hidden;font-family:'Press Start 2P',monospace;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;filter:grayscale(1) brightness(.55);transition:filter 2.2s ease}
  canvas.color{filter:none}
  #dialog{position:absolute;left:4%;right:4%;top:71%;bottom:3%;background:#fff;color:#1b1b2f;
    border:calc(var(--u)*1) solid #1b1b2f;box-shadow:0 0 0 calc(var(--u)*1) #fff, inset 0 0 0 calc(var(--u)*.5) #74acdf;
    padding:calc(var(--u)*3);font-size:var(--fs);line-height:1.75;opacity:0;transition:opacity .6s}
  #dialog.show{opacity:1}
  #text{white-space:pre-line}
  #hdr{color:#d98a00;font-size:calc(var(--fs)*.8);margin-bottom:calc(var(--u)*1.5);display:none}
  #arrow{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*2);animation:blink .8s steps(1) infinite;display:none}
  #replay{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*2.5);font:inherit;font-size:calc(var(--fs)*.8);
    background:#74acdf;color:#fff;border:calc(var(--u)*.6) solid #1b1b2f;padding:calc(var(--u)*1.2) calc(var(--u)*2);display:none;cursor:pointer}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*7);
    background:rgba(13,13,26,.82);color:#fff;text-align:center;cursor:pointer;font-size:var(--fs)}
  #start .t1{font-size:calc(var(--fs)*1.6);color:#74acdf;text-shadow:calc(var(--u)*.6) calc(var(--u)*.6) 0 #f6b40e}
  #start .heart{font-size:calc(var(--fs)*3);color:#ff5c8a;animation:pulse 1s steps(2) infinite}
  #start .blink{animation:blink 1s steps(1) infinite}
  #start .small{font-size:calc(var(--fs)*.65);opacity:.7}
  #mute{position:absolute;top:calc(var(--u)*2);right:calc(var(--u)*2);font:inherit;font-size:var(--fs);background:rgba(27,27,47,.6);color:#fff;
    border:calc(var(--u)*.5) solid #fff;width:calc(var(--u)*9);height:calc(var(--u)*9);display:none;cursor:pointer}
  #name{position:absolute;left:0;right:0;top:5%;display:flex;justify-content:center;gap:calc(var(--u)*3);
    font-size:calc(var(--fs)*3.4);pointer-events:none}
  #name span{display:inline-block;visibility:hidden;transform-origin:center;
    text-shadow:calc(var(--u)*.7) 0 0 #1b1b2f,calc(var(--u)*-.7) 0 0 #1b1b2f,0 calc(var(--u)*.7) 0 #1b1b2f,0 calc(var(--u)*-.7) 0 #1b1b2f,calc(var(--u)*.9) calc(var(--u)*.9) 0 #1b1b2f}
  #name.glow span{animation:hop 1.2s ease-in-out infinite}
  #name.glow span:nth-child(2){animation-delay:.15s}
  #name.glow span:nth-child(3){animation-delay:.3s}
  .cap{transition:color .5s;display:inline-block}
  @keyframes hop{50%{transform:translateY(calc(var(--u)*-2))}}
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{50%{transform:scale(1.2)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="96" height="170"></canvas>
  <div id="dialog"><div id="hdr"></div><span id="text"></span><span id="arrow">▼</span><button id="replay">▶ otra vez</button></div>
  <div id="name"><span style="color:#f6b40e">G</span><span style="color:#ff5c8a">I</span><span style="color:#ffffff">U</span></div>
  <button id="mute">♪</button>
  <div id="start">
    <div class="t1">PARA GIU</div>
    <div class="heart">♥</div>
    <div class="blink">PRESIONA START ▶</div>
    <div class="small">sube el volumen 🔊</div>
  </div>
</div>

<script>
// ================== MENSAJE (edítalo aquí) ==================
const INTRO = "Psst... mira hacia arriba ✦";
const FACTS = [
  { scene: 'cometa', h: '✦ 12 DE NOVIEMBRE, 2014', p: [
    "Por primera vez, una nave aterrizó en un cometa: Philae.",
    "Viajó 10 años por el espacio... y al tocarlo, ¡rebotó!" ] },
  { scene: 'sol22', h: '✦ 22 AÑOS', p: [
    "El Sol es un imán gigante: cada ~11 años sus polos se invierten.",
    "Tardan unos 22 años en volver a su lugar: ¡tu edad es un ciclo del Sol!" ] },
  { scene: 'escorpio', h: '✦ ESCORPIO', p: [
    "Su estrella más brillante es Antares, el «corazón del escorpión».",
    "Una estrella roja unas 700 veces más ancha que el Sol." ] }
];
// Tu mensaje: la primera letra de cada frase forma su nombre (G, I, U)
const MSG_G = "Gratitud y alegría es lo que representa tu vida en quienes te rodean.";
const MSG_I = "Ilumina tu sonrisa la penumbra que rodea situaciones adversas.";
const MSG_U1 = "Únicamente contigo todo es mejor,";
const MSG_U2 = " y todo sería silencio sin ti.";
const FIRMA = "— A";
// ============================================================

const W = 96, H = 170;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const dialog = document.getElementById('dialog'), textEl = document.getElementById('text');
const arrow = document.getElementById('arrow'), replayBtn = document.getElementById('replay');
const startEl = document.getElementById('start'), muteBtn = document.getElementById('mute');

function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.width = W * s + 'px';
  stage.style.height = H * s + 'px';
  stage.style.setProperty('--u', s + 'px');
  stage.style.setProperty('--fs', (W * s * 0.037) + 'px');
}
addEventListener('resize', fit); fit();

// ---------- colores ----------
const CEL = '#74acdf', WHT = '#ffffff', SUN = '#f6b40e', SUN2 = '#d98a00', PINK = '#ff5c8a';
const BROWN = '#7a4a24', FACE = '#e9c29a', DARK = '#1b1b2f';

// ---------- helpers de pixel ----------
function px(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function sprite(rows, pal, x, y, s = 1){
  for (let j = 0; j < rows.length; j++)
    for (let i = 0; i < rows[j].length; i++){
      const c = pal[rows[j][i]];
      if (c) px(x + i * s, y + j * s, s, s, c);
    }
}

// ---------- sprites originales ----------
const MONKEY = [
  "...HHHHHH...",
  "..H.BBBB.H..",
  ".H.BBBBBB.H.",
  "HHBBBBBBBBHH",
  "HHBFFBBFFBHH",
  "HHFKFFFFKFHH",
  ".BFFFFFFFFB.",
  ".BFFFNNFFFB.",
  "..BFMMMMFB..",
  "...BFFFFB...",
  "..BBBBBBBB..",
  ".BB.BFFB.BB.",
  ".B..BFFB..B.",
  "...BB..BB..."
];
const MONKEY_PAL = { B: BROWN, F: FACE, K: DARK, N: '#5a3418', M: PINK, H: '#2b2b4a' };

const CUP = [
  "WWWWWWWWW...",
  "WCCCCCCCW...",
  "WWWWWWWWWWW.",
  "WLLLLLLLW.W.",
  "WWRWWWRWW.W.",
  "WRRRWRRRWWW.",
  "WWRRRRRWW...",
  ".WWRRRWW....",
  "SSSSRSSSSSS.",
  ".SSSSSSSSS.."
];
const CUP_PAL = { W: WHT, C: '#5b3313', L: CEL, R: PINK, S: '#c9d3e0' };

const HEART = [".XX.XX.", "XXXXXXX", "XXXXXXX", ".XXXXX.", "..XXX..", "...X..."];
const MINI_HEART = [".X.X.", "XXXXX", ".XXX.", "..X.."];
const NOTE = ["..XX", "..X.", "..X.", "XXX.", "XX.."];

// ---------- escena ----------
let alive = false, finale = false;
let particles = [], confetti = [];
let lastSteam = 0, lastNote = 0;

function sunOrHeart(cx, cy, t){
  // rayos del sol de mayo, girando
  const r = 7;
  for (let i = 0; i < 16; i++){
    const a = i * Math.PI / 8 + t * 0.25;
    const len = i % 2 ? 12 : 15;
    for (let d = r + 2; d < len; d++)
      px(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 1, 1, i % 2 ? SUN2 : SUN);
  }
  if (!finale){
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++)
        if (dx * dx + dy * dy <= r * r) px(cx + dx, cy + dy, 1, 1, SUN);
    px(cx - 3, cy - 2, 1, 2, SUN2); px(cx + 2, cy - 2, 1, 2, SUN2);
    px(cx - 3, cy + 2, 1, 1, SUN2); px(cx + 2, cy + 2, 1, 1, SUN2); px(cx - 2, cy + 3, 4, 1, SUN2);
  } else {
    const s = Math.sin(t * 6) > 0 ? 3 : 2;
    sprite(HEART, { X: PINK }, cx - 3.5 * s, cy - 3 * s, s);
  }
}

// ---------- cielo nocturno con datos ----------
let scene = null, lastScene = null, sceneStart = 0, nightA = 0;
const STARS = Array.from({ length: 40 }, () => ({ x: Math.random() * W | 0, y: Math.random() * 104 | 0, p: Math.random() * 6 }));
function line(x0, y0, x1, y1, c){
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
  for (let i = 0; i <= n; i++) px(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, 1, 1, c);
}
function disc(cx, cy, r, c){
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++)
    if (dx * dx + dy * dy <= r * r) px(cx + dx, cy + dy, 1, 1, c);
}
const DIG = {
  '1': ["..X..", ".XX..", "..X..", "..X..", "..X..", "..X..", ".XXX."],
  '2': [".XXX.", "X...X", "....X", "..XX.", ".X...", "X....", "XXXXX"]
};
function ga(a){ ctx.globalAlpha = nightA * a; }
function drawComet(st){
  const cx = 61, cy = 42;
  // cola de polvo (curva, blanca-dorada)
  for (let i = 0; i < 46; i++){
    const w = 2 + (i / 7 | 0), y = cy + 2 - i * 0.3 + i * i * 0.006;
    ga((1 - i / 46) * (Math.sin(i * .9 + st * 5) > -.5 ? .8 : .5));
    px(cx - 8 - i, y - w / 2, 1, w, i % 4 ? '#fff1c9' : '#ffffff');
  }
  // cola de iones (recta, azul)
  for (let i = 0; i < 56; i++){
    const w = 1 + (i / 14 | 0);
    ga((1 - i / 56) * (Math.sin(i * 1.7 - st * 9) > -.3 ? .9 : .4));
    px(cx - 8 - i, cy - 3 - i * 0.62 - w / 2, 1, w, '#5ab0ff');
  }
  // coma brillante
  ga(.18 + Math.sin(st * 3) * .05); disc(cx, cy, 15, '#9fd3ff');
  ga(.3); disc(cx, cy, 11, '#cfe9ff');
  ga(.45); disc(cx, cy, 8, '#ffffff');
  // chispas que se desprenden
  for (let k = 0; k < 14; k++){
    const d = (st * 10 + k * 7.3) % 40;
    ga(1 - d / 40);
    px(cx - 6 - d, cy - 2 - d * 0.45 + Math.sin(k * 12.9) * 6, 1, 1, '#ffffff');
  }
  // chorros de gas desde el "cuello"
  ga(.85);
  [[-0.6, -1], [0.3, -1], [1, -0.4]].forEach(([dx, dy], k) => {
    const len = 4 + Math.round((Math.sin(st * 7 + k * 2) + 1) * 2);
    for (let i = 1; i <= len; i++) px(62 + dx * i, 41 + dy * i, 1, 1, i < 3 ? '#ffffff' : '#cfe9ff');
  });
  // núcleo: el "patito" (dos lóbulos)
  ga(1);
  disc(58, 46, 6, '#8d929c'); disc(66, 38, 4, '#8d929c');
  px(54, 47, 2, 1, '#6b707a'); px(60, 50, 1, 1, '#6b707a'); px(67, 37, 1, 1, '#6b707a');
  px(62, 43, 2, 1, '#b4b9c2'); px(57, 42, 2, 1, '#b4b9c2');
  // Philae: baja, toca y rebota
  const c = st % 7; let x, y;
  if (c < 3){ x = 80 - 6 * c; y = 4 + 11.3 * c; }
  else if (c < 4.6){ const k = (c - 3) / 1.6; x = 62 - 6 * k; y = 38 - Math.sin(k * Math.PI) * 14; }
  else { x = 56; y = 38; }
  px(x - 1, y - 1, 3, 2, '#ffffff'); px(x - 3, y - 1, 2, 1, '#5ab0ff'); px(x + 2, y - 1, 2, 1, '#5ab0ff');
  px(x - 1, y + 1, 1, 1, '#cccccc'); px(x + 1, y + 1, 1, 1, '#cccccc');
  ga(1);
}
function drawSun22(t){
  const cx = 48, cy = 46, r = 10;
  const flip = Math.floor(t / 2.6) % 2, ph = (t / 2.6) % 1;
  const N = flip ? '#74acdf' : PINK, S = flip ? PINK : '#74acdf';
  const flash = ph < .12;
  // líneas del campo magnético: lazos de polo a polo
  for (let k = 0; k < 3; k++){
    const R = r + 4 + k * 5;
    for (let a = 0; a <= Math.PI; a += 0.06){
      const y = cy - Math.cos(a) * (r + 1 + k * 1.5);
      const x = Math.sin(a) * R;
      const moving = Math.sin(a * 6 - t * 5 + k) > .6;
      ga(moving ? 1 : .55);
      const c = flash ? '#ffffff' : (a < Math.PI / 2 ? N : S);
      px(cx + x, y, 1, 1, c); px(cx - x, y, 1, 1, c);
    }
  }
  ga(1);
  // el Sol
  disc(cx, cy, r, SUN);
  disc(cx, cy, r - 3, '#ffd34d');
  px(cx - 4, cy + 1, 2, 2, SUN2); px(cx + 3, cy - 3, 1, 1, SUN2); px(cx + 2, cy + 4, 2, 1, SUN2);
  // polos
  disc(cx, cy - r, 2, N); disc(cx, cy + r, 2, S);
}
function drawScorpius(t){
  ctx.save(); ctx.translate(-14, 6);
  const D = '#4d5a99', head = [72, 24];
  const claws = [[78, 12], [84, 22], [78, 34]];
  const body = [head, [62, 32], [56, 42], [52, 52], [50, 62], [52, 72], [58, 80], [66, 82], [72, 78], [70, 71]];
  claws.forEach(s => line(head[0], head[1], s[0], s[1], D));
  for (let i = 0; i < body.length - 1; i++) line(body[i][0], body[i][1], body[i + 1][0], body[i + 1][1], D);
  [...claws, ...body].forEach((s, i) => { if (i !== 4) px(s[0], s[1], 1, 1, '#ffffff'); });
  // Antares: el corazón del escorpión, latiendo
  const beat = (t * 1.6) % 1 < .25;
  sprite(MINI_HEART, { X: '#ff4a3d' }, beat ? 59 : 60, beat ? 30 : 30.5, 1);
  if (beat){ px(57, 32, 1, 1, '#ff9a8a'); px(65, 32, 1, 1, '#ff9a8a'); px(62, 28, 1, 1, '#ff9a8a'); }
  ctx.restore();
}
function drawNight(t){
  nightA += ((scene ? 1 : 0) - nightA) * 0.04;
  if (nightA < 0.01) return;
  ctx.globalAlpha = nightA;
  px(0, 0, W, 106, '#141a3a');
  STARS.forEach(s => { if (Math.sin(t * 2 + s.p * 3) > -0.4) px(s.x, s.y, 1, 1, '#cfd8ff'); });
  const sc = scene || lastScene, st = t - sceneStart;
  if (sc === 'cometa') drawComet(st);
  if (sc === 'sol22') drawSun22(t);
  if (sc === 'escorpio') drawScorpius(t);
  ctx.globalAlpha = 1;
}
let nowT = 0;
function setScene(s){ if (s) lastScene = s; scene = s; sceneStart = nowT; }

function cloud(x, y){
  px(x + 3, y - 1, 5, 1, WHT); px(x + 1, y, 10, 1, WHT); px(x, y + 1, 13, 2, WHT);
}

function draw(t){
  // bandera: celeste, blanco, celeste
  px(0, 0, W, 35, CEL); px(0, 35, W, 35, WHT); px(0, 70, W, 36, CEL);
  // nubes
  for (let k = 0; k < 3; k++){
    const x = ((t * (2 + k) + k * 40) % (W + 20)) - 16;
    cloud(x, 8 + k * 9);
  }
  sunOrHeart(48, 52, t);
  drawNight(t);

  // mesa
  px(0, 106, W, 3, '#a0683a'); px(0, 109, W, 9, '#6b4220');
  for (let x = 4; x < W; x += 16) px(x, 111, 6, 1, '#5a3618');
  px(0, 118, W, H - 118, DARK);

  // monito con audífonos (bailando si hay música)
  const bob = alive ? -Math.round(Math.abs(Math.sin(t * 4.6)) * 2) : 0;
  sprite(MONKEY, MONKEY_PAL, 8, 106 - 28 + bob, 2);

  // café
  sprite(CUP, CUP_PAL, 62, 106 - 20, 2);

  // confeti final
  if (finale && confetti.length < 70) confetti.push(newConfetti(-2));
  confetti = confetti.filter(c => {
    c.y += c.v; c.x += Math.sin(c.y / 6 + c.ph) * 0.3;
    px(c.x, c.y, c.w, 1, c.c);
    return c.y < 118 || finale && (Object.assign(c, newConfetti(-2)), true);
  });
}

function newConfetti(y){
  const cols = [CEL, WHT, SUN, PINK];
  return { x: Math.random() * W, y: y ?? Math.random() * 100, v: .3 + Math.random() * .5,
           w: Math.random() < .5 ? 1 : 2, c: cols[Math.floor(Math.random() * cols.length)], ph: Math.random() * 6 };
}
function burst(){ for (let i = 0; i < 60; i++) confetti.push(newConfetti(Math.random() * 60 - 20)); }

let t0 = performance.now();
(function loop(now){
  nowT = (now - t0) / 1000; draw(nowT);
  requestAnimationFrame(loop);
})(t0);

// ---------- música chiptune original ----------
let ac, master, musicGain, nextTime = 0, step = 0, muted = false;
const N = n => 440 * Math.pow(2, (n - 69) / 12);
// Canon en Re — Johann Pachelbel (dominio público), arreglo chiptune
const EIGHTH = 0.36;
const BASS = [50, 45, 47, 42, 43, 38, 43, 45];                 // Re La Si Fa# Sol Re Sol La
const ARP = [[62,66,69],[57,61,64],[59,62,66],[54,57,61],[55,59,62],[62,66,69],[55,59,62],[57,61,64]];
const Q = a => a.flatMap(n => [n, null]);                       // negras
const PARTS = [
  Q([78, 76, 74, 73, 71, 69, 71, 73]),                          // Fa# Mi Re Do# Si La Si Do#
  Q([74, 73, 71, 69, 67, 66, 67, 64]),                          // Re Do# Si La Sol Fa# Sol Mi
  [74, 78, 81, 79, 78, 74, 78, 76, 74, 71, 74, 81, 79, 83, 81, 79] // corcheas
];
function note(freq, t, dur, type, vol, dest){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.03);
}
function schedule(){
  while (nextTime < ac.currentTime + 0.15){
    const cyc = Math.floor(step / 16), pos = step % 16, chord = pos >> 1;
    const part = cyc === 0 ? null : PARTS[(cyc - 1) % 3];
    if (pos % 2 === 0){
      note(N(BASS[chord]), nextTime, EIGHTH * 1.9, 'triangle', 0.14, musicGain);
      const tri = ARP[chord];
      [0, 1, 2, 1].forEach((k, i) => note(N(tri[k]), nextTime + i * EIGHTH / 2, EIGHTH * 0.45, 'square', 0.014, musicGain));
    }
    if (part && part[pos]){
      const long = part[pos + 1] === null;
      note(N(part[pos]), nextTime, EIGHTH * (long ? 1.9 : 0.9), 'square', 0.04, musicGain);
    }
    nextTime += EIGHTH; step++;
  }
}
function initAudio(){
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.connect(ac.destination);
  musicGain = ac.createGain(); musicGain.gain.value = 0; musicGain.connect(master);
  nextTime = ac.currentTime + 0.1;
  setInterval(schedule, 40);
}
function setMusic(on){
  const g = musicGain.gain, now = ac.currentTime;
  g.cancelScheduledValues(now); g.setValueAtTime(g.value, now);
  g.linearRampToValueAtTime(on ? 1 : 0, now + (on ? 1.5 : 1.2));
}
function blip(){
  if (!ac) return;
  note(700 + Math.random() * 200, ac.currentTime, 0.03, 'triangle', 0.035, master);
}
muteBtn.onclick = e => {
  e.stopPropagation(); muted = !muted;
  master.gain.value = muted ? 0 : 1; muteBtn.textContent = muted ? '🔇' : '♪';
};

// ---------- diálogo ----------
const wait = ms => new Promise(r => setTimeout(r, ms));
let skip = false;
dialog.onclick = () => { skip = true; };

const hdrEl = document.getElementById('hdr');
const nameEl = document.getElementById('name');
const slots = nameEl.querySelectorAll('span');
const NAME_COLORS = ['#f6b40e', '#ff5c8a', '#74acdf'];
let curNode = null, capEl = null;

async function typeInto(node, s){
  const base = node.textContent;
  for (const ch of s){
    if (skip){ node.textContent = base + s; break; }
    node.textContent += ch;
    if (ch !== ' ') blip();
    await wait(55);
  }
  skip = false;
}
async function typeLine(s, header = '', withCap = false){
  hdrEl.textContent = header; hdrEl.style.display = header ? 'block' : 'none';
  arrow.style.display = 'none'; textEl.innerHTML = ''; capEl = null;
  if (withCap){
    capEl = document.createElement('span'); capEl.className = 'cap';
    capEl.textContent = s[0]; textEl.appendChild(capEl); blip(); await wait(55);
    s = s.slice(1);
  }
  curNode = document.createTextNode(''); textEl.appendChild(curNode);
  await typeInto(curNode, s);
}
function chime(){
  if (!ac) return;
  [84, 88, 91].forEach((n, i) => note(N(n), ac.currentTime + i * 0.07, 0.25, 'triangle', 0.05, master));
}
// la primera letra cambia de color y vuela al centro
async function flyCap(k){
  const cap = capEl, slot = slots[k];
  cap.style.color = NAME_COLORS[k];
  await wait(800);
  const a = cap.getBoundingClientRect();
  slot.style.transition = 'none'; slot.style.transform = 'none'; slot.style.visibility = 'visible';
  const b = slot.getBoundingClientRect();
  const s = a.height / b.height;
  const dx = (a.left + a.width / 2) - (b.left + b.width / 2);
  const dy = (a.top + a.height / 2) - (b.top + b.height / 2);
  slot.style.transform = `translate(${dx}px, ${dy}px) scale(${s})`;
  cap.style.visibility = 'hidden';
  slot.offsetWidth;
  slot.style.transition = 'transform 1.5s cubic-bezier(.35,1.35,.5,1)';
  slot.style.transform = 'none';
  await wait(1300); chime(); await wait(400);
}
function resetName(){
  nameEl.classList.remove('glow');
  slots.forEach(s => { s.style.transition = 'none'; s.style.transform = 'none'; s.style.visibility = 'hidden'; });
}
async function pause(ms){ arrow.style.display = 'inline'; await wait(ms); arrow.style.display = 'none'; }
function setColor(on){ cv.classList.toggle('color', on); }

async function run(){
  replayBtn.style.display = 'none';
  finale = false; confetti = []; alive = true; resetName();
  setColor(true); setMusic(true);
  setScene(null);
  await wait(2500);
  dialog.classList.add('show');
  await typeLine(INTRO); await pause(1200);
  for (const f of FACTS){
    setScene(f.scene);
    for (const page of f.p){ await typeLine(page, f.h); await pause(3200); }
  }
  setScene(null);
  await wait(1200);
  // G
  await typeLine(MSG_G, '', true); await pause(1500); await flyCap(0);
  // I
  await typeLine(MSG_I, '', true); await pause(1500); await flyCap(1);
  // U ... y el silencio
  await typeLine(MSG_U1, '', true); await wait(1000);
  alive = false; setColor(false); setMusic(false);
  await wait(1400);
  await typeInto(curNode, MSG_U2); await pause(1800);
  await flyCap(2);
  // ...y vuelve todo, con Giu
  alive = true; finale = true; setColor(true); setMusic(true); burst();
  nameEl.classList.add('glow');
  await wait(1800);
  await typeLine(FIRMA);
  await wait(800);
  replayBtn.style.display = 'block';
}

startEl.onclick = () => {

  initAudio(); ac.resume();
  startEl.style.display = 'none'; muteBtn.style.display = 'block';
